- name: Squid Proxy Install
  hosts: TESTING
  become: true
  tasks:
    - name: Refresh APT Packages Before Install
      ansible.builtin.apt:
        update_cache: true
        upgrade: no
        cache_valid_time: 3600

    - name: Install Latest Version of Squid Available
      ansible.builtin.apt:
        name: squid
        state: latest

    - name: Make sure Squid.Service is Stopped and Not Enabled on Boot
      ansible.builtin.systemd_service:
        name: squid
        state: stopped
        enabled: false
